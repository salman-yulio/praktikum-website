<!DOCTYPE html>
<html>
<head>
    <title>Perhitungan Kunjungan Salon</title>
</head>
<body>
    <p>
        <script language="JavaScript">
            function cekBonus() {
            let totalKunjungan = parseInt(prompt("Masukkan total kunjungan salon:"));

            let kupon = totalKunjungan;

            let bonusKunjungan = Math.floor(totalKunjungan / 10);

            let bonusMessage = (bonusKunjungan > 0) ? "Anda mendapatkan " + bonusKunjungan + " kali kunjungan gratis!" 
                                                    : "Anda belum mendapatkan kunjungan gratis.";

            alert("Total kunjungan Anda: " + totalKunjungan + 
                  "\nPotongan kupon yang Anda miliki: " + kupon + 
                  "\n" + bonusMessage);
        }
            </script>
    </p>
    <h1>Perhitungan Kunjungan Salon</h1>
    <button onclick="cekBonus()">Cek Bonus</button>
</body>
</html>
